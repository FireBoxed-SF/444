#music{--music-bg:#111310;--music-panel:#1a1d18;--music-panel-2:#242820;--music-text:#f4f5ef;--music-muted:#aeb3a7;--music-line:rgba(244,245,239,.09);color:var(--music-text)}

.music-sidebar{padding:.75rem;border-right-color:var(--music-line);background:rgba(13,15,12,.9)}

.music-content{padding:1.35rem clamp(.75rem,3vw,1.7rem) 8.5rem}.music-heading{margin:.2rem 0 1.15rem}.music-heading h1{font-size:clamp(1.55rem,3vw,2.25rem);font-weight:700;letter-spacing:-.04em}.music-heading p{color:var(--music-muted)}
.music-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:1rem}.music-card{padding:.55rem;border-radius:8px}.music-card:hover{transform:translateY(-4px);background:rgba(255,255,255,.035)}.music-card-art{border-radius:7px;box-shadow:0 14px 34px rgba(0,0,0,.24)}.music-card-title{margin-top:.65rem;font-size:.78rem}.music-card-meta{font-size:.68rem}

.music-track-art{width:58px;height:58px;flex-basis:58px;border-radius:5px}.music-controls{gap:.25rem}.music-control-row{gap:.15rem}.music-icon-button{width:32px;height:32px;border-radius:50%;font-size:.75rem}.music-icon-button:hover{background:rgba(255,255,255,.07)}.music-icon-button.primary{width:40px;height:40px;background:#eef0e8;color:#171914}.music-icon-button.active{color:#d7e6b9;background:rgba(215,230,185,.1)}

@media(max-width:1100px){.music-app{grid-template-columns:220px minmax(0,1fr)}.music-player{left:220px;grid-template-columns:minmax(180px,.8fr) minmax(260px,1.5fr) minmax(130px,.4fr) 38px}.music-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:760px){.music-app{grid-template-columns:minmax(0,1fr)}.music-player{left:.5rem;right:.5rem;grid-template-columns:minmax(0,1fr) auto auto;margin:0}.music-controls{min-width:0}.music-timeline{grid-template-columns:0 minmax(0,1fr) 0}.music-timeline span{display:none}.music-volume{display:none}.music-favorite-player{display:grid}.music-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:.65rem}}
@media(max-width:430px){.music-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.music-player{grid-template-columns:minmax(0,1fr) auto}.music-controls{justify-self:end}.music-player>.music-volume,.music-favorite-player{display:none}.music-control-row{gap:.05rem}.music-control-row #music-shuffle,.music-control-row #music-repeat{display:none}}
</style>
<div id="music" class="page-content">
  <div class="music-app">
    <aside class="music-sidebar" aria-label="Music navigation">
      <div class="music-brand"><span class="music-brand-mark">♪</span><span>Music</span></div>
      <nav class="music-nav" aria-label="Music sections">
        <button class="music-nav-button active" type="button" data-music-view="home"><span>⌂</span><span>Home</span></button>
        <button class="music-nav-button" type="button" data-music-view="search"><span>⌕</span><span>Search</span></button>
        <button class="music-nav-button" type="button" data-music-view="library"><span>♡</span><span>Liked songs</span></button>
        <button class="music-nav-button" type="button" data-music-view="queue"><span>≡</span><span>Queue</span></button>
      </nav>
      <div class="music-playlists">
        <div class="music-playlists-heading"><span>Your playlists</span><button id="music-new-playlist" type="button" aria-label="Create playlist" title="Create playlist">＋</button></div>
        <div id="music-playlist-list"></div>
      </div>
    </aside>

    <main class="music-main">
      <div class="music-topbar">
        <form class="music-search" id="music-search-form" role="search">
          <span aria-hidden="true">⌕</span>
          <input id="music-search-input" type="search" placeholder="What do you want to listen to?" aria-label="Search music">
        </form>

      </div>

      <div class="music-content">
        <div class="music-heading">
          <div><h1 id="music-heading-title">Your music</h1><p id="music-heading-subtitle">Curated YouTube mixes</p></div>
        </div>
        <p class="music-status" id="music-status" role="status" aria-live="polite"></p>
        <div class="music-grid" id="music-grid"></div>
      </div>
    </main>

    <div class="music-player" aria-label="Music player">
      <div class="music-track">
        <img class="music-track-art" id="music-track-art" alt="">
        <div class="music-track-copy">
          <div class="music-track-title" id="music-track-title">No track selected</div>
          <div class="music-track-channel" id="music-track-channel">Choose a result to play</div>
        </div>
      </div>
      <div class="music-controls">
        <div class="music-control-row">
          <button class="music-icon-button" id="music-shuffle" type="button" aria-label="Shuffle" title="Shuffle">↝</button>
          <button class="music-icon-button" id="music-prev" type="button" aria-label="Previous track" title="Previous">Ⅰ</button>
          <button class="music-icon-button" id="music-back" type="button" aria-label="Back 5 seconds" title="Back 5 seconds">−5</button>
          <button class="music-icon-button primary" id="music-play" type="button" aria-label="Play" title="Play">▶</button>
          <button class="music-icon-button" id="music-forward" type="button" aria-label="Forward 5 seconds" title="Forward 5 seconds">+5</button>
          <button class="music-icon-button" id="music-next" type="button" aria-label="Next track" title="Next">Ⅱ</button>
          <button class="music-icon-button" id="music-repeat" type="button" aria-label="Repeat" title="Repeat">↻</button>
        </div>
        <div class="music-timeline"><span id="music-time-current">0:00</span><input class="music-progress" id="music-progress" type="range" min="0" max="100" value="0" aria-label="Playback position"><span id="music-time-total">0:00</span></div>
      </div>
      <div class="music-volume">
        <button class="music-icon-button" id="music-mute" type="button" aria-label="Mute" title="Mute">◖</button>
        <input id="music-volume" type="range" min="0" max="100" value="70" aria-label="Volume">
      </div>
      <button class="music-icon-button music-favorite-player" id="music-favorite" type="button" aria-label="Favorite track" title="Favorite">♡</button>
    </div>
  </div>

  <div class="music-youtube-hidden"><div id="music-youtube-player"></div></div>

</div>
<script data-loon-music-script>
(() => {
  'use strict';
  const FAVORITES_STORAGE = 'loom_music_favorites';
  const SEARCH_DIRECTORY = 'https://api.invidious.io/instances.json';
  const FALLBACK_INSTANCES = ['yt.chocolatemoo53.com','inv.nadeko.net','invidious.privacyredirect.com','invidious.projectsegfau.lt'];
  const CATALOG = [
    {id:'jfKfPfyJRdk',title:'lofi hip hop radio',channel:'Lofi Girl',genre:'lofi chill beats'},
    {id:'4xDzrJKXOOY',title:'synthwave radio',channel:'ThePrimeThanatos',genre:'synthwave electronic night'},
    {id:'Dx5qFachd3A',title:'coffee shop jazz',channel:'Jazz Relaxing',genre:'jazz coffee smooth'},
    {id:'5qap5aO4i9A',title:'lofi beats to study to',channel:'Lofi Girl',genre:'lofi study beats focus'},
    {id:'rUxyKA_-grg',title:'peaceful piano',channel:'Soothing Relaxation',genre:'piano calm relaxing'},
    {id:'lTRiuFIWV54',title:'deep focus music',channel:'Music For Focus',genre:'focus concentration ambient'},
    {id:'mPZkdNFkNps',title:'ambient study mix',channel:'Ambient Mix',genre:'ambient study relaxation'},
    {id:'6_5W2iW7dR0',title:'acoustic chill mix',channel:'Acoustic Music',genre:'acoustic indie chill'},
    {id:'n1lC7eXxY3s',title:'jazz morning radio',channel:'Jazz Radio',genre:'jazz morning relaxed'},
    {id:'DS8mI2sVqC0',title:'rain sounds and ambience',channel:'Nature Sounds',genre:'rain ambient sleep nature'},
    {id:'21X5lGlDOfg',title:'NASA live space audio',channel:'NASA',genre:'space ambient live'},
    {id:'F0N9UA8FyYw',title:'classic rock essentials',channel:'Rock Music',genre:'classic rock guitar'}
  ].map(track => ({...track,thumbnail:'https://i.ytimg.com/vi/'+track.id+'/hqdefault.jpg'}));
  let results=[],queue=[],currentIndex=-1,favorites=loadFavorites(),player=null,progressTimer=null;
  function loadFavorites(){try{return JSON.parse(localStorage.getItem(FAVORITES_STORAGE)||'[]')}catch(_){return[]}}
  function saveFavorites(){localStorage.setItem(FAVORITES_STORAGE,JSON.stringify(favorites))}
  function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[c])}
  function init(){
    const root=document.getElementById('music');
    if(!root||!document.getElementById('music-search-form')||root.dataset.musicReady==='true')return;
    root.dataset.musicReady='true';
    document.getElementById('music-search-form').addEventListener('submit',e=>{e.preventDefault();search(document.getElementById('music-search-input').value)});
    document.querySelectorAll('[data-music-view]').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('[data-music-view]').forEach(item=>item.classList.remove('active'));button.classList.add('active');
      const view=button.dataset.musicView;if(view==='library')showFavorites();else if(view==='home')showCatalog();else document.getElementById('music-search-input').focus();
    }));
    document.getElementById('music-play').addEventListener('click',togglePlay);
    document.getElementById('music-next').addEventListener('click',()=>playAt(currentIndex+1));
    document.getElementById('music-prev').addEventListener('click',()=>playAt(currentIndex-1));
    document.getElementById('music-favorite').addEventListener('click',toggleFavorite);
    document.getElementById('music-volume').addEventListener('input',e=>{if(player?.setVolume)player.setVolume(Number(e.target.value))});
    document.getElementById('music-progress').addEventListener('input',e=>{if(player?.seekTo&&player?.getDuration)player.seekTo(player.getDuration()*Number(e.target.value)/100,true)});
    loadYouTubeApi();showCatalog();
  }
  function showCatalog(){results=CATALOG.slice();queue=results;document.getElementById('music-heading-title').textContent='Your music';document.getElementById('music-heading-subtitle').textContent='Curated mixes and listening moods';renderResults(results);setStatus(results.length+' albums ready')}
  async function getSearchInstances(){try{const response=await fetch(SEARCH_DIRECTORY,{cache:'no-store'});if(response.ok){const entries=await response.json();const discovered=entries.flatMap(entry=>Array.isArray(entry)&&entry[1]?.api===true&&entry[1]?.cors===true?['https://'+entry[0]]:[]);if(discovered.length)return ['https://yt.chocolatemoo53.com',...new Set(discovered),...FALLBACK_INSTANCES.map(domain=>'https://'+domain)]}}catch(_){return[]}return FALLBACK_INSTANCES.map(domain=>'https://'+domain)}
  async function search(query){const cleanQuery=String(query||'').trim();if(!cleanQuery)return showCatalog();document.getElementById('music-heading-title').textContent='Search results';document.getElementById('music-heading-subtitle').textContent=cleanQuery;setStatus('Searching YouTube…');const instances=await getSearchInstances();for(const instance of instances){try{const params=new URLSearchParams({q:cleanQuery+' music mix',type:'video',page:'1'});const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),9000);let response;try{response=await fetch(instance+'/api/v1/search?'+params.toString(),{headers:{Accept:'application/json'},cache:'no-store',signal:controller.signal})}finally{clearTimeout(timeout)}if(!response.ok)continue;const items=await response.json();const videos=items.filter(item=>item?.type==='video'||item?.videoId).map(item=>{const videoId=item.videoId||item.video_id||item.id;return{id:videoId,title:item.title||'Untitled track',channel:item.author||item.uploaderName||'YouTube Music',artist:item.author||item.uploaderName||'YouTube Music',thumbnail:'https://i.ytimg.com/vi/'+videoId+'/hqdefault.jpg',genre:'youtube music'}}).filter(item=>item.id).slice(0,24);if(!videos.length)continue;results=videos;queue=results;renderResults(results);setStatus(results.length+' results from public YouTube search');return}catch(_){}}const localMatches=CATALOG.filter(track=>(track.title+' '+track.channel+' '+track.genre).toLowerCase().includes(cleanQuery.toLowerCase()));results=localMatches;queue=results;renderResults(results);setStatus(localMatches.length?'Showing matches from the local mix.':'No public search provider responded. Try again.')}
  function renderResults(items){const grid=document.getElementById('music-grid');grid.innerHTML=items.map((item,index)=>`<button class="music-card" type="button" data-music-index="${index}"><span class="music-card-art"><img src="${escapeHtml(item.thumbnail)}" alt="${escapeHtml(item.title)} cover" loading="lazy" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${escapeHtml(item.id)}/mqdefault.jpg'"><span class="music-card-play">▶</span></span><span class="music-card-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span><span class="music-card-meta" title="${escapeHtml(item.artist||item.channel)}">${escapeHtml(item.artist||item.channel)}</span></button>`).join('');grid.querySelectorAll('[data-music-index]').forEach(card=>card.addEventListener('click',()=>playAt(Number(card.dataset.musicIndex))))}
  function showFavorites(){queue=favorites.slice();results=queue;document.getElementById('music-heading-title').textContent='Favorites';document.getElementById('music-heading-subtitle').textContent='Saved tracks from this browser';renderResults(queue);setStatus(queue.length?queue.length+' saved tracks':'No favorites yet.')}
  function setStatus(message){document.getElementById('music-status').textContent=message}
  function toggleFavorite(){const track=queue[currentIndex];if(!track)return;const existing=favorites.findIndex(item=>item.id===track.id);if(existing>=0)favorites.splice(existing,1);else favorites.unshift(track);saveFavorites();updateFavoriteButton();setStatus(existing>=0?'Removed from favorites.':'Added to favorites.')}
  function updateFavoriteButton(){const track=queue[currentIndex],button=document.getElementById('music-favorite'),active=!!track&&favorites.some(item=>item.id===track.id);button.textContent=active?'♥':'♡';button.setAttribute('aria-label',active?'Remove from favorites':'Favorite track')}
  function loadYouTubeApi(){if(window.YT?.Player)return;window.onYouTubeIframeAPIReady=()=>createPlayer();if(!document.querySelector('script[data-youtube-api]')){const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.dataset.youtubeApi='true';document.head.appendChild(script)}}
  function createPlayer(){if(player)return;player=new window.YT.Player('music-youtube-player',{width:'1',height:'1',playerVars:{autoplay:0,controls:0,playsinline:1},events:{onReady:()=>player.setVolume(Number(document.getElementById('music-volume').value)),onStateChange:state=>{const button=document.getElementById('music-play');if(state.data===window.YT.PlayerState.PLAYING){button.textContent='Ⅱ';button.setAttribute('aria-label','Pause');startProgressTimer()}else if(state.data===window.YT.PlayerState.PAUSED){button.textContent='▶';button.setAttribute('aria-label','Play')}else if(state.data===window.YT.PlayerState.ENDED)playAt(currentIndex+1)}}})}
  function playAt(index){if(!queue.length)return;currentIndex=(index+queue.length)%queue.length;const track=queue[currentIndex];document.getElementById('music-track-title').textContent=track.title;document.getElementById('music-track-channel').textContent=track.artist||track.channel;document.getElementById('music-track-art').src=track.thumbnail;document.getElementById('music-track-art').alt=track.title;updateFavoriteButton();if(!window.YT?.Player||!player){createPlayer();setStatus('Loading player…');return}player.loadVideoById(track.id)}
  function togglePlay(){if(!player?.playVideo)return;const state=player.getPlayerState();if(state===window.YT.PlayerState.PLAYING)player.pauseVideo();else player.playVideo()}
  function startProgressTimer(){if(progressTimer)clearInterval(progressTimer);progressTimer=setInterval(()=>{if(!player?.getDuration)return;const duration=player.getDuration()||0,elapsed=player.getCurrentTime()||0;document.getElementById('music-progress').value=duration?String(Math.round(elapsed/duration*100)):'0'},500)}
  init();
})();
</script>
